[workspace]
name = "difflocks"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.4"

[dependencies]
python = "3.10.*"
pip = "*"
pytorch-cuda = "12.4.*"
cuda-version = "==12.4"
libglvnd = ">=1.7.0"
libgl-devel = "*"
mesa-libgl-devel-cos7-x86_64 = "*"

[pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/cu124/torch-2.4.0%2Bcu124-cp310-cp310-linux_x86_64.whl" }
torchvision = { url = "https://download.pytorch.org/whl/cu124/torchvision-0.19.0%2Bcu124-cp310-cp310-linux_x86_64.whl" }
accelerate = "==0.31.0"
opencv-python = "==4.9.0.80"
mediapipe = "==0.10.14"
trimesh = "==4.0.4"
jsonmerge = "==1.9.2"
dctorch = "==0.1.2"
einops = "==0.8.1"
torchdiffeq = "==0.2.5"
torchsde = "==0.2.6"
libigl = "==2.5.1"
natten = "==0.17.4"
psutil = ">=5.9.0"
numpy = "<2"
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.4cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }
